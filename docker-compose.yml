# VahaanBandhu 2.0 — local development stack.
#
# No credentials are embedded anywhere. Everything comes from .env at runtime,
# and .env is gitignored.
#
#   docker compose up -d mongo redis   # data services only
#   docker compose up --build          # full stack
#
# Startup order is enforced by health checks: the API waits for MongoDB and
# Redis to be genuinely ready, not merely started.

services:
  mongo:
    image: mongo:7
    container_name: vb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vahaanbandhu
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7
    container_name: vb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vb-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, reach services by name.
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      # Phase-A datasets are research artifacts: mounted READ-ONLY so the
      # application can never modify them.
      - ./Data:/app/Data:ro
      - ./Res:/app/Res:ro
      - ./vb:/app/vb:ro
      - ./routing:/app/routing:ro
      - ./server:/app/server
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.web
    container_name: vb-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongo-data:
  redis-data:
