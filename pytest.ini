[pytest]
# Both suites. the routing research tests need no services; the application backend
# tests need MongoDB and Redis and skip themselves when Mongo is unreachable.
testpaths = tests server/tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:qiskit.*
    ignore::DeprecationWarning:qiskit_aer.*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
